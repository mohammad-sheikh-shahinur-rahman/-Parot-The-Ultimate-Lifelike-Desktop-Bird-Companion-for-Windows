name: Publish to GitHub Packages

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  publish:
    name: Build & Publish NuGet Package
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack NuGet Package
        run: dotnet pack -c Release -o ./nupkg

      - name: Publish NuGet Package to GitHub Packages
        shell: pwsh
        run: |
          Get-ChildItem -Path ./nupkg -Filter *.nupkg | ForEach-Object {
            Write-Host "Publishing $($_.FullName)..."
            dotnet nuget push $_.FullName --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key ${{ secrets.GITHUB_TOKEN }} --skip-duplicate
          }
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
